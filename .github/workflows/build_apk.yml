name: Build Android TV & Phone APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Persistent App Signing Keystore
        run: |
          if [ ! -f app/kadri_signing.jks ]; then
            keytool -genkeypair -v -keystore app/kadri_signing.jks -storepass kadri2026 -alias kadrikey -keypass kadri2026 -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Mohammed Kadri, OU=Education, O=StalkerPlayerPro, L=Ghardaia, C=DZ"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/kadri_signing.jks
            git commit -m "Add persistent APK signing keystore for seamless updates" || true
            git push || true
          fi

      - name: Build Split APKs
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: stalker-player-pro-apks
          path: app/build/outputs/apk/debug/*.apk
